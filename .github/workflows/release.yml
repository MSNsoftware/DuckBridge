name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm install
      - name: Install server deps (jsdom)
        run: npm --prefix server install
      - name: Build (Windows)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if ($conf.version -ne $tag) { throw "tag $tag does not match app version $($conf.version)" }
      - name: Generate updater manifest
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          node scripts/make-updater-json.mjs --target windows --arch x86_64 --tag "${{ github.ref_name }}" --installer $installer
      - name: Upload updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-windows
          path: latest-windows-x86_64.json
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend deps
        run: npm install
      - name: Install server deps (jsdom)
        run: npm --prefix server install
      - name: Build (Linux)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify tag matches app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then echo "tag $tag does not match app version $version"; exit 1; fi
      - name: Generate updater manifest
        run: |
          installer=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          node scripts/make-updater-json.mjs --target linux --arch x86_64 --tag "$GITHUB_REF_NAME" --installer "$installer"
      - name: Upload updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-linux
          path: latest-linux-x86_64.json
      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  publish:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundle

      - name: Show files
        run: find bundle -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bundle/**/*.msi
            bundle/**/*.exe
            bundle/**/*.AppImage
            bundle/**/*.deb
            bundle/**/latest-windows-x86_64.json
            bundle/**/latest-linux-x86_64.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
